<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050608;
    --glass: rgba(14, 16, 20, 0.62);
    --glass-strong: rgba(12, 14, 18, 0.9);
    --line: rgba(255, 255, 255, 0.09);
    --text: #EDEBE6;
    --muted: #7E848E;
    --accent: #FFB01F;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #graph { position: fixed; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  #graph.ready { opacity: 1; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.65) 100%); }
  .hud { position: fixed; z-index: 2; }
  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }

  #title { top: 28px; left: 32px; pointer-events: none; }
  #title .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  #title .kicker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #title h1 { margin: 10px 0 0; font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  #title p { margin: 10px 0 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  #title p b { color: var(--text); font-weight: 500; }

  #tools { top: 28px; right: 32px; display: flex; gap: 8px; }
  #tools input, #tools button { font: inherit; font-size: 13px; color: var(--text); border-radius: 999px; padding: 9px 16px; outline: none; }
  #tools input { width: 220px; }
  #tools input::placeholder { color: var(--muted); }
  #tools input:focus { border-color: rgba(255,176,31,0.5); }
  #tools button { cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #tools button:hover { border-color: rgba(255,255,255,0.2); }
  #tools button span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #tools button[aria-pressed="false"] span { background: var(--muted); box-shadow: none; }

  #legend { left: 32px; bottom: 28px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 64px)); }
  #legend button { font: inherit; font-size: 12px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px 6px 10px; transition: opacity 0.2s; }
  #legend button em { font-style: normal; font-family: var(--mono); color: var(--muted); font-size: 11px; }
  #legend button[aria-pressed="false"] { opacity: 0.35; }
  #legend i { width: 8px; height: 8px; border-radius: 50%; }

  #hint { left: 50%; bottom: 32px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; pointer-events: none; white-space: nowrap; transition: opacity 0.6s; }

  #panel { position: fixed; z-index: 3; top: 16px; right: 16px; bottom: 16px; width: min(460px, calc(100vw - 32px)); border-radius: 18px; background: var(--glass-strong);
    transform: translateX(calc(100% + 24px)); transition: transform 0.35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  #panel.open { transform: none; }
  #panel header { padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
  #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #panel .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  #panel .tag i { width: 7px; height: 7px; border-radius: 50%; }
  #panel h2 { margin: 12px 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  #panel .path { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  #panel #close { all: unset; cursor: pointer; color: var(--muted); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: 18px; }
  #panel #close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  #panel .links { padding: 14px 24px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #panel .links:empty { display: none; }
  #panel .links .label { width: 100%; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
  #panel .links button { font: inherit; font-size: 12px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 9px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); }
  #panel .links button:hover { background: rgba(255,255,255,0.08); }
  #panel .links button i { width: 6px; height: 6px; border-radius: 50%; }
  #body { padding: 6px 24px 32px; overflow-y: auto; font-size: 14px; line-height: 1.65; color: #D6D3CD; }
  #body h1 { font-size: 18px; color: var(--text); letter-spacing: -0.01em; }
  #body h2 { font-size: 15px; color: var(--text); margin-top: 1.6em; }
  #body h3 { font-size: 14px; color: var(--text); }
  #body code { font-family: var(--mono); font-size: 12px; background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 5px; color: var(--text); }
  #body table { border-collapse: collapse; font-size: 12px; display: block; overflow-x: auto; }
  #body th, #body td { border-bottom: 1px solid var(--line); padding: 8px 10px 8px 0; text-align: left; vertical-align: top; }
  #body th { color: var(--muted); font-weight: 500; }
  #body a { color: var(--accent); }
  #body hr { border: 0; border-top: 1px solid var(--line); }
  #body::-webkit-scrollbar { width: 8px; } #body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; }

  #tip { position: fixed; z-index: 2; pointer-events: none; font-size: 12px; padding: 6px 10px; border-radius: 8px; opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
  #tip small { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  #empty { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); z-index: 4; }

  @media (max-width: 900px) {
    #title h1 { font-size: 26px; }
    #tools { top: auto; bottom: 28px; right: 16px; }
    #tools input { width: 150px; }
    #legend { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="graph"></div>
<div id="vignette"></div>
<div id="title" class="hud">
  <div class="kicker">AI operating system</div>
  <h1>Your brain</h1>
  <p id="stats"></p>
</div>
<div id="tools" class="hud">
  <input id="search" class="glass" type="search" placeholder="Find a file…" aria-label="Find a file">
  <button id="spin" class="glass" type="button" aria-pressed="true"><span></span>Orbit</button>
</div>
<div id="legend" class="hud"></div>
<div id="hint" class="hud">Drag to turn · Scroll to zoom · Click a file to read it</div>
<div id="tip" class="glass"></div>
<aside id="panel" class="glass" aria-label="File">
  <header>
    <div class="row"><div class="tag" id="tag"></div><button id="close" type="button" aria-label="Close">×</button></div>
    <h2 id="name"></h2>
    <div class="path" id="path"></div>
  </header>
  <div class="links" id="neighbors"></div>
  <div id="body"></div>
</aside>
<div id="empty">Couldn't load the 3D library. Check your internet connection and reload.</div>

<script id="brain-data" type="application/json">__BRAIN_DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.186.1/"
  }
}
</script>
<script type="module">
let THREE, ForceGraph3D, SpriteText;
try {
  THREE = await import("three");
  ({ default: ForceGraph3D } = await import("https://esm.sh/3d-force-graph@1.80.1?external=three"));
  ({ default: SpriteText } = await import("https://esm.sh/three-spritetext@1.10.0?external=three"));
} catch (err) {
  console.error(err);
  document.getElementById("empty").style.display = "grid";
  throw err;
}

const data = JSON.parse(document.getElementById("brain-data").textContent);
const groups = data.groups;
const byId = new Map(data.nodes.map(n => [n.id, n]));
const neighbors = new Map(data.nodes.map(n => [n.id, new Set()]));
data.links.forEach(l => { neighbors.get(l.source).add(l.target); neighbors.get(l.target).add(l.source); });

document.title = `${data.name} · your brain`;
document.getElementById("stats").innerHTML =
  `<b>${data.nodes.length}</b> files &nbsp;·&nbsp; <b>${data.links.length}</b> connections &nbsp;·&nbsp; ${data.built}`;

const colorOf = id => (groups[byId.get(id).group] || groups.other).color;
const groupName = id => (groups[byId.get(id).group] || groups.other).name;
const linkId = end => typeof end === "object" ? end.id : end;
const radius = n => 2.2 + Math.sqrt(n.degree) * 1.6;

// Labels: all of them for a small brain, only the busiest files for a big one.
const ranked = [...data.nodes].sort((a, b) => b.degree - a.degree);
const alwaysLabeled = new Set((data.nodes.length <= 40 ? ranked : ranked.slice(0, 14)).map(n => n.id));

// A soft round glow, drawn once and shared by every node.
const glowTexture = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,255,255,0.9)");
  grad.addColorStop(0.25, "rgba(255,255,255,0.35)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

const parts = new Map();
function makeNode(n) {
  const color = new THREE.Color(colorOf(n.id));
  const group = new THREE.Group();
  const r = radius(n);
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(r, 24, 16),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: n.template ? 0.55 : 1 })
  );
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture, color, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  halo.scale.set(r * 5, r * 5, 1);
  const label = new SpriteText(n.label, n.id === "AGENTS.md" ? 4.2 : 3, "rgba(237,235,230,0.78)");
  label.fontFace = "Inter, system-ui, sans-serif";
  label.fontWeight = "500";
  label.position.y = r + 5;
  label.material.depthWrite = false;
  group.add(halo, core, label);
  parts.set(n.id, { core, halo, label, base: n.template ? 0.55 : 1 });
  return group;
}

const hidden = new Set();
let focused = null, hovered = null;

function litSet() {
  const ids = [focused, hovered].filter(Boolean);
  if (!ids.length) return null;
  const set = new Set(ids);
  ids.forEach(id => neighbors.get(id).forEach(x => set.add(x)));
  return set;
}

function refresh() {
  const lit = litSet();
  parts.forEach((p, id) => {
    const on = !lit || lit.has(id);
    p.core.material.opacity = on ? p.base : 0.12;
    p.halo.material.opacity = on ? 0.35 : 0.03;
    p.label.visible = lit ? lit.has(id) : alwaysLabeled.has(id);
    p.label.material.opacity = on ? 1 : 0.2;
  });
  graph.linkColor(graph.linkColor()).linkWidth(graph.linkWidth()).linkDirectionalParticles(graph.linkDirectionalParticles());
}

const touches = (l, ids) => ids.some(id => id && (id === linkId(l.source) || id === linkId(l.target)));

const graph = ForceGraph3D({ controlType: "orbit" })(document.getElementById("graph"))
  .backgroundColor("#050608")
  .showNavInfo(false)
  .graphData({ nodes: data.nodes.map(n => ({ ...n })), links: data.links.map(l => ({ ...l })) })
  .nodeId("id")
  .enableNodeDrag(false)
  .warmupTicks(160)
  .cooldownTicks(120)
  .nodeVal(n => radius(n) ** 2 / 16)
  .nodeLabel(() => "")
  .nodeThreeObject(makeNode)
  .nodeVisibility(n => !hidden.has(n.group))
  .linkVisibility(l => !hidden.has(byId.get(linkId(l.source)).group) && !hidden.has(byId.get(linkId(l.target)).group))
  .linkOpacity(0.22)
  .linkCurvature(0.12)
  .linkColor(l => {
    const ids = [focused, hovered];
    if (!ids.some(Boolean)) return colorOf(linkId(l.source));
    return touches(l, ids) ? colorOf(linkId(touches(l, [focused]) && focused === linkId(l.target) ? l.target : l.source)) : "#1A1C20";
  })
  .linkWidth(l => touches(l, [focused, hovered]) ? 0.9 : 0.25)
  .linkDirectionalParticles(l => !(focused || hovered) || touches(l, [focused, hovered]) ? 1 : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(0.0035)
  .linkDirectionalParticleColor(l => colorOf(linkId(l.source)))
  .onNodeHover(n => {
    hovered = n ? n.id : null;
    document.body.style.cursor = n ? "pointer" : "";
    showTip(n);
    refresh();
  })
  .onNodeClick(n => open(n.id))
  .onBackgroundClick(() => close());

graph.d3Force("charge").strength(-70);
graph.d3Force("link").distance(l => 26 + 4 * Math.min(byId.get(linkId(l.source)).degree, byId.get(linkId(l.target)).degree));


// Faint dust in the background for depth.
(() => {
  const count = 1400, pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 900 + Math.random() * 1400, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.sin(p) * Math.sin(t), r * Math.cos(p)], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  graph.scene().add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x8a8f98, size: 1.6, transparent: true, opacity: 0.35, depthWrite: false })));
})();

refresh();

// Slow orbit until someone grabs the view.
const controls = graph.controls();
controls.autoRotateSpeed = 0.45;
const spinButton = document.getElementById("spin");
function setSpin(on) {
  controls.autoRotate = on;
  spinButton.setAttribute("aria-pressed", String(on));
}
spinButton.addEventListener("click", () => setSpin(!controls.autoRotate));
document.getElementById("graph").addEventListener("pointerdown", () => {
  setSpin(false);
  document.getElementById("hint").style.opacity = 0;
});
// Frame the whole brain, then fade it in and start the orbit.
let fitted = false;
function fit() {
  if (fitted) return;
  fitted = true;
  // Frame most of the brain; a few loose files drifting far out shouldn't shrink the rest.
  const nodes = graph.graphData().nodes.filter(n => n.x !== undefined);
  if (nodes.length) {
    const center = new THREE.Vector3();
    nodes.forEach(n => center.add(new THREE.Vector3(n.x, n.y, n.z)));
    center.divideScalar(nodes.length);
    const dists = nodes.map(n => center.distanceTo(new THREE.Vector3(n.x, n.y, n.z))).sort((a, b) => a - b);
    const radius = dists[Math.floor((dists.length - 1) * 0.92)] + 20;
    const fov = graph.camera().fov * Math.PI / 180;
    const aspect = Math.min(1, innerWidth / innerHeight);
    const dist = radius / Math.sin(fov / 2) / aspect;
    graph.cameraPosition({ x: center.x, y: center.y, z: center.z + dist }, center, 0);
    controls.target.copy(center);
    controls.update();
  }
  document.getElementById("graph").classList.add("ready");
  setSpin(true);
}
graph.onEngineStop(fit);
setTimeout(fit, 1500);

// Hover tooltip for files without a visible label.
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => { tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px"; });
function showTip(n) {
  if (!n || parts.get(n.id).label.visible) { tip.style.opacity = 0; return; }
  tip.innerHTML = "";
  tip.append(n.label);
  const small = document.createElement("small");
  small.textContent = n.id;
  tip.append(small);
  tip.style.opacity = 1;
}

// Side panel.
const panel = document.getElementById("panel");
function open(id) {
  const n = byId.get(id);
  if (!n) return;
  focused = id;
  setSpin(false);
  refresh();
  tip.style.opacity = 0;
  const live = graph.graphData().nodes.find(x => x.id === id);
  if (live && live.x !== undefined) {
    const len = Math.hypot(live.x, live.y, live.z) || 1, dist = 150;
    graph.cameraPosition(
      { x: live.x + (live.x / len) * dist, y: live.y + (live.y / len) * dist, z: live.z + (live.z / len) * dist },
      { x: live.x, y: live.y, z: live.z }, 1000);
  }
  const tag = document.getElementById("tag");
  tag.innerHTML = `<i style="background:${colorOf(id)};box-shadow:0 0 8px ${colorOf(id)}"></i>`;
  tag.append(groupName(id));
  tag.style.color = colorOf(id);
  document.getElementById("name").textContent = n.label;
  document.getElementById("path").textContent = id;
  const list = document.getElementById("neighbors");
  const linked = [...neighbors.get(id)].sort((a, b) => byId.get(a).label.localeCompare(byId.get(b).label));
  list.replaceChildren();
  if (linked.length) {
    const head = document.createElement("div");
    head.className = "label";
    head.textContent = `Connected to ${linked.length}`;
    list.append(head);
  }
  linked.forEach(other => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<i style="background:${colorOf(other)}"></i>`;
    b.append(byId.get(other).label);
    b.addEventListener("click", () => open(other));
    list.append(b);
  });
  const body = document.getElementById("body");
  body.innerHTML = DOMPurify.sanitize(marked.parse(n.text));
  body.scrollTop = 0;
  panel.classList.add("open");
}
function close() {
  focused = null;
  panel.classList.remove("open");
  refresh();
}
document.getElementById("close").addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

// Legend doubles as a filter.
const present = new Set(data.nodes.map(n => n.group));
const legend = document.getElementById("legend");
Object.entries(groups).filter(([key]) => present.has(key)).forEach(([key, g]) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "glass";
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${g.color};box-shadow:0 0 8px ${g.color}"></i>`;
  b.append(g.name);
  const count = document.createElement("em");
  count.textContent = data.nodes.filter(n => n.group === key).length;
  b.append(count);
  b.addEventListener("click", () => {
    hidden.has(key) ? hidden.delete(key) : hidden.add(key);
    b.setAttribute("aria-pressed", String(!hidden.has(key)));
    graph.nodeVisibility(graph.nodeVisibility()).linkVisibility(graph.linkVisibility());
  });
  legend.append(b);
});

// Search jumps to the first match.
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  const hit = q && data.nodes.find(n => n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
  if (hit) open(hit.id);
});

window.addEventListener("resize", () => {
  graph.width(innerWidth).height(innerHeight);
});
</script>
</body>
</html>
